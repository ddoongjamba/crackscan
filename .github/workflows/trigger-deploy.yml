name: Deploy Trigger.dev Workers

on:
  push:
    branches: [main]
    paths:
      - 'trigger/**'
      - 'lib/**'
      - 'trigger.config.ts'
      - 'package.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx trigger.dev@4.4.4 deploy
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_SECRET_KEY }}
